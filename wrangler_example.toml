name = "capi"
main = "src/worker.js"
compatibility_date = "2025-01-01"
account_id = ""

[vars]
API_NAME = "CAPI"
API_VERSION = "1.0.0"
DISCORD_TOKEN = ""
DISCORD_CLIENT_ID = ""
DISCORD_CLIENT_SECRET = ""
DISCORD_PUBLIC_KEY = ""
DISCORD_GUILD_ID = ""
BOT_API_KEY = ""

# D1 database binding (create the database with `wrangler d1 create capi_db`)
[[d1_databases]]
# binding name returned by `wrangler d1 create capi_db` — keep in sync with your account
binding = "capi_db"
database_name = "capi_db"
database_id = ""

# R2 bucket bindings created in the current Cloudflare account.
[[r2_buckets]]
binding = "capi_assets"
bucket_name = "capi-assets"

[[r2_buckets]]
binding = "capi_user_assets"
bucket_name = "capi-user-assets"

# KV namespace (create with `wrangler kv:namespace create CAPI_KV` and paste id below)
[[kv_namespaces]]
binding = "CAPI_KV"
id = ""