name = "capi"
main = "src/worker.js"
compatibility_date = "2025-01-01"
account_id = ""

[vars]
API_NAME = "CAPI"
API_VERSION = "1.0.0"
DISCORD_TOKEN = ""
DISCORD_CLIENT_ID = ""
DISCORD_CLIENT_SECRET = ""
DISCORD_PUBLIC_KEY = ""
DISCORD_GUILD_ID = ""
BOT_API_KEY = ""

# D1 database binding (create the database with `wrangler d1 create capi_db`)
[[d1_databases]]
# binding name returned by `wrangler d1 create capi_db` — keep in sync with your account
binding = "capi_db"
database_name = "capi_db"
database_id = ""
